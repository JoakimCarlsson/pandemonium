# Make: how files are told to be makefiles and how they are edited. Make has
# no language server.

name = "Make"
version = "0.1.0"
description = "Makefiles."
icon = "icon.svg"
color = "#c9a27a"
family = ""
grammar = "make"
suffixes = ["mk", "mak"]
names = ["Makefile", "makefile", "GNUmakefile"]
aliases = ["makefile", "mk"]
line_comment = "#"
indent = 4
tabs = true
pairs = ["()", "{}", "\"\"", "''"]

[grammar_file]
url = "https://github.com/tree-sitter-grammars/tree-sitter-make/releases/download/v1.1.1/tree-sitter-make.wasm"
sha256 = "1254d1e5787be8bb944d55d1f6552b6b2b7908272ed498013bfdc07bd7d042dd"

[[lens]]
kind = "target"
title = "Run Target"
command = "make {name}"

[[task]]
name = "make: {name}"
command = "make {name}"
files = ["GNUmakefile", "makefile", "Makefile"]
groups = { build = ["all", "build", "release"], test = ["test", "check", "lint"], run = ["run", "start", "dev"] }

[task.each]
regex = '(?m)^(?<name>[A-Za-z0-9_][A-Za-z0-9_./-]*)[ \t]*:([^=]|$)'
