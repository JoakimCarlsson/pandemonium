# CSS: how files are told to be CSS, how they are edited and the language
# server that reads them.

name = "CSS"
version = "0.1.0"
description = "CSS with the VS Code CSS language server."
icon = "icon.svg"
color = "#a98be0"
grammar = "css"
suffixes = ["css"]
indent = 2
pairs = ["()", "[]", "{}", "\"\"", "''"]

[grammar_file]
url = "https://github.com/tree-sitter/tree-sitter-css/releases/download/v0.25.0/tree-sitter-css.wasm"
sha256 = "8a23977fe271357cce6f254ef88c9bebf3854602d8046605aef6a45c02135c59"

[server]
id = "vscode-css-language-server"
language_id = "css"
command = "vscode-css-language-server"
args = ["--stdio"]

[server.init]
provideFormatter = true

[server.install]
kind = "npm"
version = "4.10.0"
packages = ["vscode-langservers-extracted@4.10.0"]
