# CSS: how files are told to be CSS, how they are edited and the language
# server that reads them.

name = "CSS"
version = "0.1.0"
description = "CSS with the VS Code CSS language server."
icon = "icon.svg"
color = "#a98be0"
emmet = "style"
grammar = "css"
suffixes = ["css"]
indent = 2
pairs = ["()", "[]", "{}", "\"\"", "''"]

word_characters = "-"

[grammar_file]
url = "https://github.com/tree-sitter/tree-sitter-css/releases/download/v0.25.0/tree-sitter-css.wasm"
sha256 = "8a23977fe271357cce6f254ef88c9bebf3854602d8046605aef6a45c02135c59"

[server]
id = "vscode-css-language-server"
language_id = "css"
command = "vscode-css-language-server"
args = ["--stdio"]

[server.init]
provideFormatter = true

[server.install]
kind = "command"
version = "4.10.0"
command = ["npm", "ci", "--ignore-scripts", "--no-audit", "--no-fund", "--loglevel=error"]
needs = "Node.js and npm"
bin = "node_modules/.bin"
files = ["package.json", "package-lock.json"]
# Pinned by the lockfile: vscode-langservers-extracted@4.10.0

# Tailwind CSS class names, read alongside the main server in projects that use
# Tailwind. Its completions are offered everywhere in the file.
[[companion]]

[companion.detect]
text = [["package.json", '"tailwindcss"\s*:']]
files = ["tailwind.config.*"]

[companion.server]
id = "tailwindcss-language-server"
language_id = "css"
command = "tailwindcss-language-server"
args = ["--stdio"]
project = ["node_modules/.bin"]

[companion.server.settings.tailwindCSS]
classAttributes = ["class", "className", "ngClass", "class:list"]

[companion.server.install]
kind = "command"
version = "0.16.0"
command = ["npm", "ci", "--ignore-scripts", "--no-audit", "--no-fund", "--loglevel=error"]
needs = "Node.js and npm"
bin = "node_modules/.bin"
files = ["tailwindcss.package.json:package.json", "tailwindcss.package-lock.json:package-lock.json"]
# Pinned by the lockfile: @tailwindcss/language-server@0.16.0
