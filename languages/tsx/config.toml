# TSX: how files are told to be TSX, how they are edited and the language
# server that reads them. The server is the one TypeScript installs, and a
# project's own TypeScript is used before the one installed with it, so plugins
# a project's tsconfig.json names, such as Next.js's, are loaded.

name = "TSX"
version = "0.1.0"
description = "TSX, React and Next.js components with typescript-language-server."
icon = "icon.svg"
color = "#5aa9e6"
family = "javascript"
grammar = "tsx"
suffixes = ["tsx"]
aliases = ["typescriptreact"]
line_comment = "//"
indent = 2
pairs = ["()", "[]", "{}", "\"\"", "''", "``"]

# Parts of a file that are edited differently. Inside the children of a JSX
# element, comments are written {/* */} and there are no line comments, and
# Emmet abbreviations expand. Inside a tag's attributes and the braces of an
# expression the language's own rules hold.
[scope.jsx]
nodes = ["jsx_element"]
line_comment = ""
block_comment = ["{/*", "*/}"]
emmet = true

[scope.jsx-code]
nodes = ["jsx_opening_element", "jsx_closing_element", "jsx_self_closing_element", "jsx_expression"]

[scope.string]
nodes = ["string", "template_string"]

# The nodes that make up a tag, so that typing the `>` of an opening tag writes
# its closing tag after it.
[tags]
element = "jsx_element"
open = "jsx_opening_element"
close = "jsx_closing_element"
names = ["identifier", "member_expression", "jsx_namespace_name"]

[grammar_file]
url = "https://github.com/tree-sitter/tree-sitter-typescript/releases/download/v0.23.2/tree-sitter-tsx.wasm"
sha256 = "79e5da75ea62855a0cd67177685f0164eac87d5f630b3cbe1e0a099751ad30f8"

[server]
id = "typescript-language-server"
language_id = "typescriptreact"
command = "typescript-language-server"
args = ["--stdio"]
project = ["node_modules/.bin"]

[server.install]
kind = "npm"
version = "6.0.2"
packages = ["typescript-language-server@6.0.2", "typescript@6.0.3"]

# Tailwind CSS class names, read alongside the main server in projects that use
# Tailwind. Completions are offered only inside strings and template strings, where class names are written.
[[companion]]
scopes = ["string"]

[companion.detect]
dependencies = ["tailwindcss"]
files = ["tailwind.config.*"]

[companion.server]
id = "tailwindcss-language-server"
language_id = "typescriptreact"
command = "tailwindcss-language-server"
args = ["--stdio"]
project = ["node_modules/.bin"]

[companion.server.settings.tailwindCSS]
classAttributes = ["class", "className", "ngClass", "class:list"]

[companion.server.install]
kind = "npm"
version = "0.16.0"
packages = ["@tailwindcss/language-server@0.16.0"]
pin = "tailwindcss"
