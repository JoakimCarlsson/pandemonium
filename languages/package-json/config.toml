# package.json: how the manifest of an npm package is told apart from other
# JSON, how it is edited, the language server that reads it, the lens that runs
# each script and how the latest version of each dependency is found. It comes
# with JavaScript and TypeScript.

name = "npm Manifest"
version = "0.1.0"
description = "package.json with the VS Code JSON language server, a lens to run each script and the latest version of each dependency from npm."
icon = "icon.svg"
color = "#e6c84f"
grammar = "json"
hidden = true
family = "javascript"
names = ["package.json"]
aliases = ["package-json", "npm"]
line_comment = "//"
indent = 2
pairs = ["[]", "{}", "\"\""]

[grammar_file]
url = "https://github.com/tree-sitter/tree-sitter-json/releases/download/v0.24.8/tree-sitter-json.wasm"
sha256 = "d2119fb98d5912719b13f9458574f8608d2d29dfbe45f6be1f860ea1fe2a2405"

[server]
id = "vscode-json-language-server"
language_id = "json"
command = "vscode-json-language-server"
args = ["--stdio"]

[server.init]
provideFormatter = true

[server.install]
kind = "npm"
version = "4.10.0"
packages = ["vscode-langservers-extracted@4.10.0"]

[[lens]]
kind = "script"
title = "Run Script"
command = "npm run {name}"
toolchain = "javascript"

[dependencies]
url = "https://registry.npmjs.org/{name}/latest"
latest = ["version"]
escape = [["/", "%2f"]]
requirement = '^(?<prefix>[\^~=v ]*)(?<version>[0-9]+(?:\.[0-9]+)*)(?<pre>-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$'

[dependencies.private]
hosts = ["npm_config_registry", "NPM_CONFIG_REGISTRY"]
ini = ["~/.npmrc", ".npmrc"]
ini_keys = ["registry", "{scope}:registry"]

[[task]]
name = "pnpm: {name}"
command = "pnpm run {name}"
files = ["package.json"]
requires = ["pnpm-lock.yaml"]
groups = { build = ["build", "compile"], test = ["test", "check"], run = ["start", "dev", "serve"] }

[task.each]
json = "scripts"

[[task]]
name = "yarn: {name}"
command = "yarn run {name}"
files = ["package.json"]
requires = ["yarn.lock"]
absent = ["pnpm-lock.yaml"]
groups = { build = ["build", "compile"], test = ["test", "check"], run = ["start", "dev", "serve"] }

[task.each]
json = "scripts"

[[task]]
name = "bun: {name}"
command = "bun run {name}"
files = ["package.json"]
requires = ["bun.lock"]
absent = ["pnpm-lock.yaml", "yarn.lock"]
groups = { build = ["build", "compile"], test = ["test", "check"], run = ["start", "dev", "serve"] }

[task.each]
json = "scripts"

[[task]]
name = "bun: {name}"
command = "bun run {name}"
files = ["package.json"]
requires = ["bun.lockb"]
absent = ["pnpm-lock.yaml", "yarn.lock", "bun.lock"]
groups = { build = ["build", "compile"], test = ["test", "check"], run = ["start", "dev", "serve"] }

[task.each]
json = "scripts"

[[task]]
name = "npm: {name}"
command = "npm run {name}"
files = ["package.json"]
absent = ["pnpm-lock.yaml", "yarn.lock", "bun.lock", "bun.lockb"]
groups = { build = ["build", "compile"], test = ["test", "check"], run = ["start", "dev", "serve"] }

[task.each]
json = "scripts"

[[toolchain]]
system = [["node", "--version"]]

[[toolchain]]
children = ["~/.nvm/versions/node"]
bin = ["bin"]
program = "node"
name = "nvm {name}"

[[toolchain]]
children = ["~/.local/share/fnm/node-versions"]
bin = ["installation/bin"]
program = "node"
name = "fnm {name}"
