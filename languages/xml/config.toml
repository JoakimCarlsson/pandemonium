# XML: how files are told to be XML, how they are edited and the language
# server that reads them. Files that name a schema or a DTD are checked against
# it.

name = "XML"
version = "0.1.0"
description = "XML with LemMinX."
icon = "icon.svg"
color = "#9fb0bd"
emmet = "markup"
grammar = "xml"
suffixes = ["xml", "xsd", "xsl", "xslt", "svg", "plist", "rss", "atom", "xaml", "csproj", "fsproj", "vbproj", "props", "targets", "nuspec", "resx", "wsdl", "pom", "xib", "storyboard"]
aliases = ["xsd", "xsl", "xslt", "svg", "plist"]
indent = 2
pairs = ["()", "[]", "\"\"", "''"]

previews = { svg = "vector" }

[grammar_file]
url = "https://github.com/tree-sitter-grammars/tree-sitter-xml/releases/download/v0.7.0/tree-sitter-xml.wasm"
sha256 = "9950327f8542a3d563fe4192aa05986a53e6fd6adca518cbb1a1699cbc8970ad"

[server]
id = "lemminx"
language_id = "xml"
command = "lemminx"

[server.install]
kind = "download"
version = "0.29.3"

