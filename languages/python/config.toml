# Python: how files are told to be Python, how they are edited and the
# language server that reads them. The project's own environment is looked in
# first, so the server sees the packages installed there.

name = "Python"
version = "0.1.0"
description = "Python with pyright, using the project's virtual environment."
icon = "icon.svg"
color = "#6fb0e0"
grammar = "python"
suffixes = ["py", "pyi"]
aliases = ["py", "python3"]
line_comment = "#"
indent = 4
pairs = ["()", "[]", "{}", "\"\"", "''"]

generated = [".venv", "venv", "__pycache__"]

[grammar_file]
url = "https://github.com/tree-sitter/tree-sitter-python/releases/download/v0.25.0/tree-sitter-python.wasm"
sha256 = "16108b50df4ee9a30168794252ab55e7c93bfc5765d7fa0aa3e335752c515f47"

[server]
id = "pyright"
language_id = "python"
command = "pyright-langserver"
args = ["--stdio"]
project = [".venv/bin", "venv/bin", ".venv/Scripts", "venv/Scripts"]

[server.settings.python.analysis]
autoSearchPaths = true
useLibraryCodeForTypes = true
diagnosticMode = "openFilesOnly"

[server.install]
kind = "command"
version = "1.1.414"
command = ["npm", "ci", "--ignore-scripts", "--no-audit", "--no-fund", "--loglevel=error"]
needs = "Node.js and npm"
bin = "node_modules/.bin"
files = ["package.json", "package-lock.json"]
# Pinned by the lockfile: pyright@1.1.414

[[task]]
name = "pip install"
command = "python -m pip install -r requirements.txt"
files = ["requirements.txt"]

[[task]]
name = "pip install"
command = "python -m pip install -e ."
files = ["pyproject.toml"]
absent = ["requirements.txt"]

[[task]]
name = "pytest"
command = "python -m pytest"
group = "test"
files = ["pytest.ini", "conftest.py", "tests"]
source = "pyproject.toml"

[[task]]
name = "pytest"
command = "python -m pytest"
group = "test"
files = ["pyproject.toml"]
text = [["pyproject.toml", "pytest"]]

[[task]]
name = "python: {name}"
command = "{name}"
group = "run"
files = ["pyproject.toml"]

[task.each]
toml = ["project.scripts", "tool.poetry.scripts"]

[[task]]
name = "python main.py"
command = "python main.py"
group = "run"
files = ["main.py"]

[[toolchain]]
title = "Python"
system = [["python3", "--version"], ["python", "--version"]]

[[toolchain]]
project = [".venv", "venv", "env"]
bin = ["bin", "Scripts"]
program = "python"
name = "venv {name}"
env = { VIRTUAL_ENV = "{folder}" }
detail_file = "pyvenv.cfg"
detail_keys = ["version", "version_info"]
detail_prefix = "Python "

[[toolchain]]
children = ["~/.pyenv/versions"]
bin = ["bin"]
program = "python"
name = "pyenv {name}"

[[debug_adapter]]
id = "debugpy"
name = "Debugpy"
programs = ["python3", "python"]
arguments = ["-m", "debugpy.adapter"]
connect = "stdio"
types = ["debugpy", "python"]
attach = ["python"]
set = { console = "internalConsole" }

[[debug_scenario]]
label = "Python: Current File"
adapter = "debugpy"
suffixes = ["py"]
config = { program = "${file}", cwd = "${workspaceFolder}" }
