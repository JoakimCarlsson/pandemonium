# Python: how files are told to be Python, how they are edited and the
# language server that reads them. The project's own environment is looked in
# first, so the server sees the packages installed there.

name = "Python"
version = "0.1.0"
description = "Python with pyright, using the project's virtual environment."
icon = "icon.svg"
color = "#6fb0e0"
grammar = "python"
suffixes = ["py", "pyi"]
aliases = ["py", "python3"]
requires = ["toml"]
line_comment = "#"
toolchain_name = "Python"
indent = 4
pairs = ["()", "[]", "{}", "\"\"", "''"]

# Quotes are not closed inside strings and comments, which overrides.scm names.
brackets = [
  { start = "\"", end = "\"", close = true, not_in = ["string", "comment"] },
  { start = "'", end = "'", close = true, not_in = ["string", "comment"] },
]

# Debug adapter, and what a Python file offers to be debugged as.
[[debug_adapter]]
id = "debugpy"
name = "Debugpy"
programs = ["python3", "python"]
arguments = ["-m", "debugpy.adapter"]
connect = "stdio"
types = ["debugpy", "python"]
attach_names = ["python"]

[debug_adapter.set]
console = "internalConsole"

[[debug_scenario]]
suffixes = ["py"]
label = "Python: Current File"
adapter = "debugpy"
config = { program = "${file}", cwd = "${workspaceFolder}" }

[grammar_file]
url = "https://github.com/tree-sitter/tree-sitter-python/releases/download/v0.25.0/tree-sitter-python.wasm"
sha256 = "16108b50df4ee9a30168794252ab55e7c93bfc5765d7fa0aa3e335752c515f47"

[server]
id = "pyright"
language_id = "python"
command = "pyright-langserver"
args = ["--stdio"]
project = [".venv/bin", "venv/bin", ".venv/Scripts", "venv/Scripts"]

[server.settings.python.analysis]
autoSearchPaths = true
useLibraryCodeForTypes = true
diagnosticMode = "openFilesOnly"

[server.install]
kind = "command"
tool = "npm"
needs = "Node.js and npm"
steps = [["ci", "--ignore-scripts", "--no-audit", "--no-fund", "--loglevel=error"]]
copy = ["package.json", "package-lock.json"]
bin = "node_modules/.bin"
version = "1.1.414"
packages = ["pyright@1.1.414"]

# Where Python toolchains are kept: the system's, the project's own virtual environments and those pyenv holds.
[[toolchain_source]]
kind = "system"
programs = ["python3", "python"]

[[toolchain_source]]
kind = "project"
names = [".venv", "venv", "env"]
label = "venv {name}"
bin_windows = "Scripts"
programs = ["python"]
env = { VIRTUAL_ENV = "{path}" }
version_file = "pyvenv.cfg"
version_keys = ["version", "version_info"]
version_label = "Python {version}"

[[toolchain_source]]
kind = "children"
folder = "~/.pyenv/versions"
label = "pyenv {name}"
programs = ["python"]
