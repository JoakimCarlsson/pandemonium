# Dotenv: how files of environment variables are told apart and how they are
# edited. The files are named by pattern, since for `.env` the suffix is the
# whole name. A dotenv file has no language server.

name = "Dotenv"
version = "0.1.0"
description = "Environment files: .env, .env.local, .env.production and the like."
icon = "icon.svg"
color = "#8fbf7f"
grammar = "dotenv"
suffixes = ["env"]
names = [".env"]
patterns = [".env.*"]
aliases = ["env", "dotenv"]
line_comment = "#"
indent = 2
pairs = ["{}", "\"\"", "''"]

[grammar_file]
url = "https://github.com/pnx/tree-sitter-dotenv/releases/download/v1.1.3/tree-sitter-dotenv.wasm"
sha256 = "c71a0aeb9c5739f7f9b83c382b0d37befa860320570d2399bccc4c661e9cce24"
