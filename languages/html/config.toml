# HTML: how files are told to be HTML, how they are edited and the language
# server that reads them. The styles and scripts written inside a page are read
# by the same server.

name = "HTML"
version = "0.1.0"
description = "HTML with the VS Code HTML language server."
icon = "icon.svg"
color = "#e4704a"
emmet = "markup"
grammar = "html"
suffixes = ["html", "htm", "xhtml"]
aliases = ["htm", "xhtml"]
indent = 2
pairs = ["()", "[]", "{}", "\"\"", "''"]

word_characters = "-"

[grammar_file]
url = "https://github.com/tree-sitter/tree-sitter-html/releases/download/v0.23.2/tree-sitter-html.wasm"
sha256 = "c48fcd82c7ea8bf943180088ba7f28c48b2bb5287874179168bf9d31e394cf85"

[server]
id = "vscode-html-language-server"
language_id = "html"
command = "vscode-html-language-server"
args = ["--stdio"]

[server.init]
provideFormatter = true

[server.init.embeddedLanguages]
css = true
javascript = true

[server.install]
kind = "command"
version = "4.10.0"
command = ["npm", "ci", "--ignore-scripts", "--no-audit", "--no-fund", "--loglevel=error"]
needs = "Node.js and npm"
bin = "node_modules/.bin"
files = ["package.json", "package-lock.json"]
# Pinned by the lockfile: vscode-langservers-extracted@4.10.0

# Tailwind CSS class names, read alongside the main server in projects that use
# Tailwind. Its completions are offered everywhere in the file.
[[companion]]

[companion.detect]
text = [["package.json", '"tailwindcss"\s*:']]
files = ["tailwind.config.*"]

[companion.server]
id = "tailwindcss-language-server"
language_id = "html"
command = "tailwindcss-language-server"
args = ["--stdio"]
project = ["node_modules/.bin"]

[companion.server.settings.tailwindCSS]
classAttributes = ["class", "className", "ngClass", "class:list"]

[companion.server.install]
kind = "command"
version = "0.16.0"
command = ["npm", "ci", "--ignore-scripts", "--no-audit", "--no-fund", "--loglevel=error"]
needs = "Node.js and npm"
bin = "node_modules/.bin"
files = ["tailwindcss.package.json:package.json", "tailwindcss.package-lock.json:package-lock.json"]
# Pinned by the lockfile: @tailwindcss/language-server@0.16.0
