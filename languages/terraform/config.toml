# Terraform: how files are told to be Terraform, how they are edited and the
# language server that reads them. OpenTofu files are Terraform too; other HCL,
# with the lock and test files of Terraform, is HCL.

name = "Terraform"
version = "0.1.0"
description = "Terraform and OpenTofu with terraform-ls."
icon = "icon.svg"
color = "#9f6bf0"
grammar = "terraform"
suffixes = ["tf", "tfvars", "tofu"]
aliases = ["tf", "tfvars", "opentofu", "tofu"]
line_comment = "#"
indent = 2
pairs = ["()", "[]", "{}", "\"\""]

[grammar_file]
url = "https://github.com/tree-sitter-grammars/tree-sitter-hcl/releases/download/v1.2.0/tree-sitter-terraform.wasm"
sha256 = "59dbcbb0f08eb78b78f37510834559a48ce5c9d4866c978d62c6390796461cb5"

[server]
id = "terraform-ls"
language_id = "terraform"
command = "terraform-ls"
args = ["serve"]
check = ["version"]

[server.install]
kind = "download"
version = "0.39.0"

