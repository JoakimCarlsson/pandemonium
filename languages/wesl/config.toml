# WESL: how files are told to be WESL, how they are edited and the language
# server that reads them, which is the one WGSL uses. grammar.wasm is built
# from wgsl-tooling-wg/tree-sitter-wesl v0.1.0.

name = "WESL"
version = "0.1.0"
description = "WGSL extended with imports and conditional compilation, with wgsl-analyzer."
icon = "icon.svg"
color = "#9b8be0"
grammar = "wesl"
suffixes = ["wesl"]
line_comment = "//"
indent = 4
pairs = ["()", "[]", "{}"]

[server]
id = "wgsl-analyzer"
language_id = "wesl"
command = "wgsl-analyzer"
check = ["--version"]

[server.install]
kind = "download"
version = "2026-09-30"

[server.install.downloads.linux-x86_64]
url = "https://github.com/wgsl-analyzer/wgsl-analyzer/releases/download/2026-09-30/wgsl-analyzer-x86_64-unknown-linux-gnu.gz"
