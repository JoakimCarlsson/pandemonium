# C++: how files are told to be C++, how they are edited and the language
# server that reads them. clangd needs the folder of headers it ships with
# beside it, so it is not installed here: the one on the machine's path is
# used, the same one C files are read by.

name = "C++"
version = "0.1.0"
description = "C++ with clangd."
icon = "icon.svg"
color = "#b48ad8"
grammar = "cpp"
suffixes = ["cpp", "cc", "cxx", "c++", "hpp", "hh", "hxx", "h++", "ipp", "tpp", "inl", "cppm", "ixx"]
aliases = ["c++", "cc", "cxx", "hpp"]
line_comment = "//"
indent = 4
pairs = ["()", "[]", "{}", "\"\"", "''"]

[grammar_file]
url = "https://github.com/tree-sitter/tree-sitter-cpp/releases/download/v0.23.4/tree-sitter-cpp.wasm"
sha256 = "174eb0deb75b2ec7881bcacda9f995648d8e683956e5c2267e69ab6dc503fcbf"

[server]
id = "clangd"
language_id = "cpp"
command = "clangd"
check = ["--version"]

[[debug_adapter]]
id = "gdb"
name = "GDB"
programs = ["gdb"]
arguments = ["--interpreter=dap", "--quiet"]
connect = "stdio"
types = ["gdb", "cppdbg"]

[[debug_adapter]]
id = "lldb-dap"
name = "LLDB"
programs = ["lldb-dap", "lldb-vscode"]
connect = "stdio"
types = ["lldb", "lldb-dap", "codelldb"]
attach = ["*"]
