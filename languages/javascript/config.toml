# JavaScript: how files are told to be JavaScript, how they are edited and the language
# server that reads them. A project's own TypeScript is used before the one
# installed with the server.

name = "JavaScript"
version = "0.1.0"
description = "JavaScript and JSX, React and Next.js components with typescript-language-server."
icon = "icon.svg"
color = "#e6c84f"
family = "javascript"
emmet = "markup"
grammar = "javascript"
suffixes = ["js", "mjs", "cjs", "jsx"]
aliases = ["js", "jsx"]
requires = ["package-json"]
line_comment = "//"
indent = 2
pairs = ["()", "[]", "{}", "\"\"", "''", "``"]

# Parts of a file that are edited differently. Inside the children of a JSX
# element, comments are written {/* */} and there are no line comments, and
# Emmet abbreviations expand. Inside a tag's attributes and the braces of an
# expression the language's own rules hold.
word_characters = "$"

block_openers = ":"

[scope.jsx]
nodes = ["jsx_element"]
line_comment = ""
block_comment = ["{/*", "*/}"]
emmet = true

[scope.jsx-code]
nodes = ["jsx_opening_element", "jsx_closing_element", "jsx_self_closing_element", "jsx_expression"]

[scope.string]
nodes = ["string", "template_string"]

# The nodes that make up a tag, so that typing the `>` of an opening tag writes
# its closing tag after it.
[tags]
element = "jsx_element"
open = "jsx_opening_element"
close = "jsx_closing_element"
names = ["identifier", "member_expression", "jsx_namespace_name"]

[grammar_file]
url = "https://github.com/tree-sitter/tree-sitter-javascript/releases/download/v0.25.0/tree-sitter-javascript.wasm"
sha256 = "5fb488d0cabb4775a594bab85682de5ad6ce83c0d6ac997a9f82dd084d571240"

[server]
id = "typescript-language-server"
language_id = "javascript"
command = "typescript-language-server"
args = ["--stdio"]
project = ["node_modules/.bin"]

# The server tells a JSX file from a plain script by what it is sent, which
# decides whether `<div>` is read as an element.
[server.language_ids]
jsx = "javascriptreact"

[server.install]
kind = "command"
version = "6.0.2"
command = ["npm", "ci", "--ignore-scripts", "--no-audit", "--no-fund", "--loglevel=error"]
needs = "Node.js and npm"
bin = "node_modules/.bin"
files = ["package.json", "package-lock.json"]
# Pinned by the lockfile: typescript-language-server@6.0.2, typescript@6.0.3

# Tailwind CSS class names, read alongside the main server in projects that use
# Tailwind. Completions are offered only inside strings and template strings, where class names are written.
[[companion]]
suffixes = ["jsx"]
scopes = ["string"]

[companion.detect]
text = [["package.json", '"tailwindcss"\s*:']]
files = ["tailwind.config.*"]

[companion.server]
id = "tailwindcss-language-server"
language_id = "javascriptreact"
command = "tailwindcss-language-server"
args = ["--stdio"]
project = ["node_modules/.bin"]

[companion.server.settings.tailwindCSS]
classAttributes = ["class", "className", "ngClass", "class:list"]

[companion.server.install]
kind = "command"
version = "0.16.0"
command = ["npm", "ci", "--ignore-scripts", "--no-audit", "--no-fund", "--loglevel=error"]
needs = "Node.js and npm"
bin = "node_modules/.bin"
files = ["tailwindcss.package.json:package.json", "tailwindcss.package-lock.json:package-lock.json"]
# Pinned by the lockfile: @tailwindcss/language-server@0.16.0
