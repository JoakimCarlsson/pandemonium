# TypeScript: how files are told to be TypeScript, how they are edited and the language
# server that reads them. A project's own TypeScript is used before the one
# installed with the server.

name = "TypeScript"
version = "0.1.0"
description = "TypeScript with typescript-language-server."
icon = "icon.svg"
color = "#5aa9e6"
family = "javascript"
grammar = "typescript"
suffixes = ["ts", "mts", "cts"]
aliases = ["ts"]
line_comment = "//"
indent = 2
pairs = ["()", "[]", "{}", "\"\"", "''", "``"]
requires = ["tsx", "package-json"]

[grammar_file]
url = "https://github.com/tree-sitter/tree-sitter-typescript/releases/download/v0.23.2/tree-sitter-typescript.wasm"
sha256 = "778025db5a8be0e70f8ccc3671e486dfeddd048c25d9e8a70c26de2e1bf6f97d"

[server]
id = "typescript-language-server"
language_id = "typescript"
command = "typescript-language-server"
args = ["--stdio"]
project = ["node_modules/.bin"]

[server.install]
kind = "npm"
version = "6.0.2"
packages = ["typescript-language-server@6.0.2", "typescript@6.0.3"]
