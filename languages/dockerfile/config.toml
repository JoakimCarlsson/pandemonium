# Dockerfile: how files are told to be Dockerfiles, how they are edited and the
# language server that reads them. No grammar is published for it, so the
# folder holds its own, built with tree-sitter CLI 0.27.1 from
# camdencheek/tree-sitter-dockerfile v0.2.0.

name = "Dockerfile"
version = "0.1.0"
description = "Dockerfiles and Containerfiles with the Docker language server."
icon = "icon.svg"
color = "#4fa3e0"
grammar = "dockerfile"
suffixes = ["dockerfile", "containerfile"]
names = ["Dockerfile", "Containerfile"]
patterns = ["Dockerfile.*", "Containerfile.*"]
aliases = ["docker", "containerfile"]
line_comment = "#"
indent = 4
pairs = ["[]", "{}", "\"\"", "''"]

[server]
id = "docker-langserver"
language_id = "dockerfile"
command = "docker-langserver"
args = ["--stdio"]

[server.install]
kind = "command"
tool = "npm"
needs = "Node.js and npm"
steps = [["ci", "--ignore-scripts", "--no-audit", "--no-fund", "--loglevel=error"]]
copy = ["package.json", "package-lock.json"]
bin = "node_modules/.bin"
version = "0.15.0"
packages = ["dockerfile-language-server-nodejs@0.15.0"]

# A second server for the same files, from Docker, which runs beside the first.
# It also reads Compose files, as `languages` says, and tells itself apart from
# Dockerfiles by the name `dockercompose`, but it does not start for them until
# the reader names it among the servers of Docker Compose.
[[companion]]

[companion.server]
id = "docker-language-server"
language_id = "dockerfile"
languages = ["docker-compose"]
command = "docker-language-server"
args = ["start", "--stdio"]

[companion.server.language_ids]
docker-compose = "dockercompose"

[companion.server.install]
kind = "download"
version = "0.20.1"

[companion.server.install.downloads.linux-x86_64]
url = "https://github.com/docker/docker-language-server/releases/download/v0.20.1/docker-language-server-linux-amd64-v0.20.1"
