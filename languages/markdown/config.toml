# Markdown: how files are told to be Markdown, how they are edited and the
# language server that reads them. The text inside each block is inline
# markdown, a grammar of its own installed with this one.

name = "Markdown"
version = "0.1.0"
description = "Markdown with marksman."
icon = "icon.svg"
color = "#7fb7e8"
grammar = "markdown"
suffixes = ["md", "markdown", "mdx"]
aliases = ["md"]
requires = ["markdown-inline"]
indent = 2
pairs = ["()", "[]", "``"]

[grammar_file]
url = "https://github.com/tree-sitter-grammars/tree-sitter-markdown/releases/download/v0.5.3/tree-sitter-markdown.wasm"
sha256 = "dd9fc12ac2804d7c7da787e4774125b32e4fb3c244e5e7031a77cb7dd8036020"

[server]
id = "marksman"
language_id = "markdown"
command = "marksman"
args = ["server"]

[server.install]
kind = "download"
version = "2026-02-08"

[server.install.downloads.linux-x86_64]
url = "https://github.com/artempyanykh/marksman/releases/download/2026-02-08/marksman-linux-x64"
