# Protocol Buffers: how files are told to be Protocol Buffers, how they are
# edited and the language server that reads them. No grammar is released
# built, so grammar.wasm in this folder was built with tree-sitter CLI 0.27.1
# from coder3101/tree-sitter-proto v0.6.0.

name = "Protocol Buffers"
version = "0.1.0"
description = "Protocol Buffers with the buf language server."
icon = "icon.svg"
color = "#4cc2b0"
grammar = "proto"
suffixes = ["proto"]
aliases = ["protobuf", "proto3", "proto2"]
line_comment = "//"
indent = 2
pairs = ["()", "[]", "{}", "<>", "\"\"", "''"]

[server]
id = "buf"
language_id = "proto"
command = "buf"
args = ["lsp", "serve"]
check = ["--version"]

[server.install]
kind = "download"
version = "1.74.0"

[server.install.downloads.linux-x86_64]
url = "https://github.com/bufbuild/buf/releases/download/v1.74.0/buf-Linux-x86_64"
