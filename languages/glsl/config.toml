# GLSL: how files are told to be GLSL, how they are edited and the language
# server that reads them. grammar.wasm is built from
# tree-sitter-grammars/tree-sitter-glsl v0.2.0.

name = "GLSL"
version = "0.1.0"
description = "OpenGL and Vulkan shaders with glsl_analyzer."
icon = "icon.svg"
color = "#e07a9c"
grammar = "glsl"
suffixes = ["glsl", "vert", "frag", "geom", "comp", "tesc", "tese", "mesh", "task", "rgen", "rint", "rahit", "rchit", "rmiss", "rcall"]
aliases = ["vert", "frag", "comp"]
line_comment = "//"
indent = 4
pairs = ["()", "[]", "{}", "\"\""]

[server]
id = "glsl_analyzer"
language_id = "glsl"
command = "glsl_analyzer"
check = ["--version"]

[server.install]
kind = "download"
version = "1.7.1"

[server.install.downloads.linux-x86_64]
url = "https://github.com/nolanderc/glsl_analyzer/releases/download/v1.7.1/x86_64-linux-musl.zip"
sha256 = "7c929b304e0d34abf4305d07895c409861f054613c3ae4070baa7ca15c916e7a"
archive = "zip"
member = "bin/glsl_analyzer"

