# Swift: how files are told to be Swift, how they are edited and the language
# server that reads them. sourcekit-lsp ships with the Swift toolchain and
# needs the rest of it beside it, so it is not installed here: the one on the
# machine's path is used.

name = "Swift"
version = "0.1.0"
description = "Swift with sourcekit-lsp."
icon = "icon.svg"
color = "#f2675a"
grammar = "swift"
suffixes = ["swift"]
line_comment = "//"
indent = 4
pairs = ["()", "[]", "{}", "\"\""]

[grammar_file]
url = "https://github.com/alex-pinkus/tree-sitter-swift/releases/download/0.7.3/tree-sitter-swift.wasm"
sha256 = "0258a7ef17303a8079ffe0748b3583d59656b5c3e8653fca7b6451b3e6689eb2"

[server]
id = "sourcekit-lsp"
language_id = "swift"
command = "sourcekit-lsp"
check = ["--help"]
