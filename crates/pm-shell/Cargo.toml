[package]
name = "pm-shell"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
pm-browser = { version = "0.15.0-rc.2", path = "../pm-browser" }
pm-buffer = { version = "0.15.0-rc.2", path = "../pm-buffer" }
pm-client.workspace = true
pm-config.workspace = true
pm-editor = { version = "0.15.0-rc.2", path = "../pm-editor" }
pm-git.workspace = true
pm-harness.workspace = true
pm-lsp.workspace = true
pm-markdown = { version = "0.15.0-rc.2", path = "../pm-markdown" }
pm-protocol.workspace = true
pm-ssh = { version = "0.15.0-rc.2", path = "../pm-ssh" }
pm-terminal = { version = "0.15.0-rc.2", path = "../pm-terminal" }
pm-text.workspace = true
pm-transport = { version = "0.15.0-rc.2", path = "../pm-transport" }
pm-treesitter.workspace = true
png = "0.18"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "3.2.0"

[dev-dependencies]
tungstenite = "0.30.0"
