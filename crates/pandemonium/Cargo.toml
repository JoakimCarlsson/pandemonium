[package]
name = "pandemonium"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["image-data", "wayland-data-control"] }
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "webp"] }
pm-harness.workspace = true
pm-components.workspace = true
pm-pages.workspace = true
pm-git.workspace = true
pm-store.workspace = true
rfd = "0.17.2"
pm-protocol.workspace = true
pm-client.workspace = true
pm-ssh.workspace = true
pm-server.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
pm-treesitter.workspace = true
pm-lsp.workspace = true
pm-editor.workspace = true
pm-config.workspace = true
resvg = "0.48.1"
mermaid-svg = "0.7.0"
latex-rust = "2.1.1"
pm-transport.workspace = true
pm-browser = { path = "../pm-browser" }
pm-update.workspace = true
pm-vim.workspace = true
winit = "0.31.0-beta.4"
rustle = { git = "https://github.com/JoakimCarlsson/rustle", version = "0.1.0" }
rustle-wgpu = { git = "https://github.com/JoakimCarlsson/rustle", version = "0.1.0" }
pm-field = { version = "0.15.0-rc.4", path = "../pm-field" }

[target.'cfg(target_os = "linux")'.dependencies]
wayland-backend = { version = "0.3.17", features = ["client_system"] }
wayland-client = "0.31.15"

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6.15"
