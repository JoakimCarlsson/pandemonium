[package]
name = "pandemonium"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
pm-acp.workspace = true
pm-core.workspace = true
pm-dap.workspace = true
pm-gfx.workspace = true
pm-text.workspace = true
pm-ui.workspace = true
pm-vim.workspace = true
pm-vt.workspace = true
pollster = "1.0.1"
pulldown-cmark = { version = "0.13.4", default-features = false }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_norway = "0.9.42"
winit = "0.30.13"

[build-dependencies]
winresource = "0.1.31"
