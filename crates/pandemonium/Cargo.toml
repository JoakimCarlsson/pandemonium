[package]
name = "pandemonium"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
base64 = "0.23.1"
getrandom = "0.3"
image = { version = "0.25.10", default-features = false, features = ["png"] }
mermaid-svg = "0.7.0"
pm-acp.workspace = true
pm-core.workspace = true
pm-dap.workspace = true
pm-gfx.workspace = true
pm-text.workspace = true
pm-ui.workspace = true
pm-vim.workspace = true
pm-vt.workspace = true
pollster = "1.0.1"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_norway = "0.9.42"
similar = "3.2.0"
winit = "0.30.13"

[build-dependencies]
winresource = "0.1.31"

[target.'cfg(target_os = "linux")'.dependencies]
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
