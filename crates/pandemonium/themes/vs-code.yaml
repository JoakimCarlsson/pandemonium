# The VS Code family: the Dark 2026 and Light 2026 themes VS Code ships as
# its default, with its default terminal palettes.
#
# VS Code paints hovers and selections as translucent washes; each is
# given here as the colour it comes out as over the surface it is drawn on.
name: VS Code
dark:
  colors:
    background: "#121314"
    surface: "#191a1b"
    surface_hover: "#2b2c2d"
    surface_active: "#474849"
    surface_selected: "#383939"
    border: "#2a2b2c"
    border_variant: "#2a2b2c"
    border_focused: "#3994bcb3"
    border_selected: "#3994bcb3"
    drop_target: "#3994bc1a"
    text: "#bfbfbf"
    text_muted: "#8c8c8c"
    text_subtle: "#555555"
    text_on_accent: "#ffffff"
    cursor: "#bbbebf"
    selection: "#276782"
    link: "#48a0c7"
    accent: "#297aa0"
    accent_hover: "#2b7da3"
    accent_active: "#297aa0"
    success: "#73c991"
    warning: "#cca700"
    danger: "#f48771"
  syntax:
    keyword: "#ff7b72"
    string: "#a5d6ff"
    function: "#d2a8ff"
    comment: "#8b949e"
    number: "#79c0ff"
    type_name: "#ffa657"
    punctuation: "#bbbebf"
    variable: "#c9d1d9"
    property: "#79c0ff"
    constant: "#79c0ff"
    operator: "#ff7b72"
    tag: "#7ee787"
    attribute: "#79c0ff"
  terminal:
    ansi:
      - "#000000"
      - "#cd3131"
      - "#0dbc79"
      - "#e5e510"
      - "#2472c8"
      - "#bc3fbc"
      - "#11a8cd"
      - "#e5e5e5"
      - "#666666"
      - "#f14c4c"
      - "#23d18b"
      - "#f5f543"
      - "#3b8eea"
      - "#d670d6"
      - "#29b8db"
      - "#e5e5e5"
    cursor: "#bfbfbf"
    selection: "#3994bc33"
  emphasis:
    selection: 0.87
    current_line: 0.11
