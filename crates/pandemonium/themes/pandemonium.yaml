# The Pandemonium family: near-black neutral greys, and no accent colour.
#
# The theme the editor starts in. The primary action is a darker surface
# rather than a bright fill, so the only colour on the screen comes from the
# code and from the states that mean something — success, warning, danger.
name: Pandemonium
dark:
  colors:
    background: "#0e0f10"
    surface: "#151618"
    surface_hover: "#24272a"
    surface_active: "#2e3134"
    surface_selected: "#1f2225"
    border: "#26282b"
    border_variant: "#1a1c1d"
    border_focused: "#5d6268"
    border_selected: "#474c52"
    drop_target: "#93979b80"
    text: "#e2e3e6"
    text_muted: "#93979b"
    text_subtle: "#63676a"
    text_on_accent: "#e2e3e6"
    cursor: "#e2e3e6"
    selection: "#9aa4b0"
    link: "#8fb2cf"
    accent: "#060708"
    accent_hover: "#191b1e"
    accent_active: "#030304"
    success: "#458158"
    warning: "#d9a343"
    danger: "#e06c62"
  syntax:
    keyword: "#8fa8c4"
    string: "#8bc79a"
    function: "#8fb2cf"
    comment: "#63676a"
    number: "#d9a343"
    type_name: "#9ec5a8"
    punctuation: "#7c848c"
    variable: "#e2e3e6"
    property: "#b9c6d4"
    constant: "#c9a97a"
    operator: "#a3abb3"
    tag: "#a9bfd8"
    attribute: "#b0c9a9"
  terminal:
    ansi:
      - "#2a2d31"
      - "#e06c62"
      - "#7fb97f"
      - "#d9a343"
      - "#74a0c8"
      - "#b98dc4"
      - "#63b8b8"
      - "#c8cacd"
      - "#5a5e63"
      - "#f08a80"
      - "#9ad39a"
      - "#ecc06a"
      - "#93bbe0"
      - "#cfa8d8"
      - "#86d2d2"
      - "#f2f3f5"
    cursor: "#c8cacd"
    selection: "#74a0c840"
light:
  colors:
    background: "#ffffff"
    surface: "#f8f8f8"
    surface_hover: "#e5e5e7"
    surface_active: "#d8d8db"
    surface_selected: "#ebedef"
    border: "#e0e0e0"
    border_variant: "#ececec"
    border_focused: "#8d9298"
    border_selected: "#676c72"
    drop_target: "#6a6a6a80"
    text: "#3b3b3b"
    text_muted: "#6a6a6a"
    text_subtle: "#949494"
    text_on_accent: "#ffffff"
    cursor: "#16181b"
    selection: "#4a5560"
    link: "#3f5a78"
    accent: "#16181b"
    accent_hover: "#2e3237"
    accent_active: "#0b0c0e"
    success: "#165832"
    warning: "#9a6b0f"
    danger: "#b3332b"
  syntax:
    keyword: "#3f5a78"
    string: "#1f7a45"
    function: "#5c7d9e"
    comment: "#8a8a8a"
    number: "#9a6b0f"
    type_name: "#2f6b4a"
    punctuation: "#6b7178"
    variable: "#3b3b3b"
    property: "#40566b"
    constant: "#7a5410"
    operator: "#55606a"
    tag: "#34506e"
    attribute: "#3f6b4f"
  terminal:
    ansi:
      - "#30333a"
      - "#b3332b"
      - "#1f7a45"
      - "#9a6b0f"
      - "#2f5d8c"
      - "#81419b"
      - "#15707a"
      - "#6a6a6a"
      - "#8a8a8a"
      - "#cc4136"
      - "#2a9459"
      - "#b5851b"
      - "#3d76ad"
      - "#9c56b8"
      - "#1d8b96"
      - "#1b1c1e"
    cursor: "#3b3b3b"
    selection: "#2f5d8c33"
