[package]
name = "pm-components"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = [
  "clock",
  "std",
] }
pm-harness.workspace = true
pm-config.workspace = true
pm-editor.workspace = true
pm-git.workspace = true
pm-markdown.workspace = true
pm-protocol.workspace = true
pm-terminal.workspace = true
pm-treesitter.workspace = true
pm-vim.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "3.2.0"
rustle = { git = "https://github.com/JoakimCarlsson/rustle", tag = "0.1.3", features = [
  "icons-fill",
] }
pm-buffer.workspace = true

[dev-dependencies]
pm-store = { workspace = true, features = ["scratch-folders"] }
