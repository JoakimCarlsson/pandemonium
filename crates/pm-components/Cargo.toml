[package]
name = "pm-components"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
pm-harness.workspace = true
pm-config.workspace = true
pm-editor.workspace = true
pm-git.workspace = true
pm-icon.workspace = true
pm-input.workspace = true
pm-markdown.workspace = true
pm-protocol.workspace = true
pm-style.workspace = true
pm-terminal.workspace = true
pm-text.workspace = true
pm-theme.workspace = true
pm-treesitter.workspace = true
pm-ui.workspace = true
pm-vim.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "3.2.0"
rustle = { git = "https://github.com/JoakimCarlsson/rustle", version = "0.1.0", features = ["icons-fill"] }
rustle-wgpu = { git = "https://github.com/JoakimCarlsson/rustle", version = "0.1.0" }
pm-color.workspace = true
pm-field = { version = "0.15.0-rc.4", path = "../pm-field" }
resvg = "0.48.1"

[dev-dependencies]
pm-renderer = { path = "../pm-renderer" }
