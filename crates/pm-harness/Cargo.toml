[package]
name = "pm-harness"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
omc-session = { git = "https://github.com/JoakimCarlsson/oh-my-crab", tag = "0.1.0", default-features = false }
omc-wire = { git = "https://github.com/JoakimCarlsson/oh-my-crab", tag = "0.1.0" }
pm-agent-library = { version = "0.14.4", path = "../pm-agent-library" }
pm-buffer.workspace = true
pm-lsp.workspace = true
pm-tools.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "sync", "macros"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
