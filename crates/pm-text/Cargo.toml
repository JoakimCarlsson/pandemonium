[package]
name = "pm-text"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
pm-host.workspace = true
flate2 = "1.1.10"
globset = "0.4.20"
lsp-types = { version = "0.97.0", features = ["proposed"] }
regex = "1.13.1"
ropey = "1.6.1"
serde_json = "1.0.151"
sha2 = "0.11.0"
streaming-iterator = "0.1.9"
tar = "0.4.46"
tree-sitter = { version = "0.27.0", features = ["wasm"] }
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-containerfile = "0.9.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-kotlin-sg = "0.4.1"
tree-sitter-language = "0.1.8"
tree-sitter-lua = "0.5.0"
tree-sitter-md = "0.5.3"
tree-sitter-php = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-sequel = "0.3.11"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-wesl = "0.1.0"
tree-sitter-yaml = "0.7.2"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
