[package]
name = "pm-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pandemonium-server"
path = "src/main.rs"

[dependencies]
getrandom = "0.4.3"
notify = "8.2.0"
pm-acp.workspace = true
pm-dap.workspace = true
pm-git.workspace = true
pm-lsp.workspace = true
pm-plugin.workspace = true
pm-policy.workspace = true
pm-protocol.workspace = true
pm-store.workspace = true
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tungstenite = "0.30.0"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
