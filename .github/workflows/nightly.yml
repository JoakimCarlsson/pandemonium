name: Nightly

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  changes:
    name: changes on next
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: next
      - id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          built="$(gh release view nightly --json targetCommitish --jq .targetCommitish 2>/dev/null || true)"
          if [ "$built" = "$(git rev-parse HEAD)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: nightly
    needs: changes
    if: needs.changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      ref: next
      tag: nightly
