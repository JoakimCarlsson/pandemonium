name: Release

on:
  push:
    tags: ['v*']

run-name: Release ${{ github.ref_name }}

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  TAG: ${{ github.ref_name }}

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the version and channel
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match workspace version $version"
            exit 1
          fi
          channel=stable
          case "$TAG" in *-*) channel=preview ;; esac
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "PANDEMONIUM_CHANNEL=$channel" >> "$GITHUB_ENV"

      - name: Install system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: cargo build -p pandemonium -p pm-server --locked --profile dist --target ${{ matrix.target }}

      - name: Bundle the embedded browser
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: scripts/bundle-browser.sh build/dist/pandemonium-browser-linux-x86_64.tar.gz

      - name: Package
        run: |
          target="${{ matrix.target }}"
          if [ "$PANDEMONIUM_CHANNEL" = "preview" ]; then
            slug=pandemonium-preview
            label="Pandemonium Preview"
            identifier=io.github.joakimcarlsson.pandemonium.preview
          else
            slug=pandemonium
            label=Pandemonium
            identifier=io.github.joakimcarlsson.pandemonium
          fi
          editor="$slug-$VERSION-$target"
          server="$slug-server-$VERSION-$target"
          mkdir -p "build/dist/$editor" "build/dist/$server"
          for package in "$editor" "$server"; do
            cp LICENSE README.md "build/dist/$package/"
          done
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/$target/dist/pandemonium.exe" "build/dist/$editor/$slug.exe"
            cp "target/$target/dist/pandemonium-server.exe" "build/dist/$server/$slug-server.exe"
          else
            cp "target/$target/dist/pandemonium" "build/dist/$editor/$slug"
            cp "target/$target/dist/pandemonium-server" "build/dist/$server/$slug-server"
            sed -e "s|^Name=.*|Name=$label|" -e "s|^Exec=.*|Exec=$slug|" \
              -e "s|^Icon=.*|Icon=$slug|" -e "s|^StartupWMClass=.*|StartupWMClass=$slug|" \
              packaging/pandemonium.desktop > "build/dist/$editor/$slug.desktop"
            mkdir -p "build/dist/$editor/icons"
            cp assets/brand/pandemonium.svg assets/brand/png/pandemonium-*.png "build/dist/$editor/icons/"
            rm "build/dist/$editor/icons/pandemonium-1024.png"
          fi
          cd build/dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$editor.zip" "$editor" >/dev/null
            7z a "$server.zip" "$server" >/dev/null
          else
            tar -czf "$editor.tar.gz" "$editor"
            tar -czf "$server.tar.gz" "$server"
          fi
          if [ "${{ runner.os }}" = "macOS" ]; then
            ../../scripts/bundle-macos.sh "$editor/$slug" "$label.app" "$label" "$identifier"
            ditto -c -k --keepParent "$label.app" "$editor.app.zip"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            build/dist/pandemonium-*.tar.gz
            build/dist/pandemonium-*.zip
            build/dist/pandemonium-browser-*.sha256
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: build/dist
          merge-multiple: true

      - name: Checksums
        working-directory: build/dist
        run: sha256sum pandemonium-* > SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" build/dist/* \
            --verify-tag \
            --generate-notes \
            --title "$TAG" \
            $prerelease
