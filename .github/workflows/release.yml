name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the workspace version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match workspace version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: cargo build -p pandemonium -p pm-server --locked --profile dist --target ${{ matrix.target }}

      - name: Package
        run: |
          editor="pandemonium-$VERSION-${{ matrix.target }}"
          server="pandemonium-server-$VERSION-${{ matrix.target }}"
          mkdir -p "build/dist/$editor" "build/dist/$server"
          for package in "$editor" "$server"; do
            cp LICENSE README.md "build/dist/$package/"
          done
          cp assets/icons/LICENSES "build/dist/$editor/LICENSES-icons"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/dist/pandemonium.exe" "build/dist/$editor/"
            cp "target/${{ matrix.target }}/dist/pandemonium-server.exe" "build/dist/$server/"
          else
            cp "target/${{ matrix.target }}/dist/pandemonium" "build/dist/$editor/"
            cp "target/${{ matrix.target }}/dist/pandemonium-server" "build/dist/$server/"
            cp packaging/pandemonium.desktop "build/dist/$editor/"
            mkdir -p "build/dist/$editor/icons"
            cp assets/brand/pandemonium.svg assets/brand/png/pandemonium-*.png "build/dist/$editor/icons/"
            rm "build/dist/$editor/icons/pandemonium-1024.png"
          fi
          cd build/dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$editor.zip" "$editor" >/dev/null
            7z a "$server.zip" "$server" >/dev/null
          else
            tar -czf "$editor.tar.gz" "$editor"
            tar -czf "$server.tar.gz" "$server"
          fi
          if [ "${{ runner.os }}" = "macOS" ]; then
            ../../scripts/bundle-macos.sh "$editor/pandemonium" Pandemonium.app \
              Pandemonium io.github.joakimcarlsson.pandemonium
            ditto -c -k --keepParent Pandemonium.app "$editor.app.zip"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            build/dist/pandemonium-*.tar.gz
            build/dist/pandemonium-*.zip
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: build/dist
          merge-multiple: true

      - name: Checksums
        working-directory: build/dist
        run: sha256sum pandemonium-* > SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" build/dist/* \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            $prerelease
