[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.12.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
pm-primitives = { path = "crates/pm-primitives" }
pm-color = { path = "crates/pm-color" }
pm-renderer = { path = "crates/pm-renderer" }
pm-shaders = { path = "crates/pm-shaders" }
pm-layout = { path = "crates/pm-layout" }
pm-typography = { path = "crates/pm-typography" }
pm-decoration = { path = "crates/pm-decoration" }
pm-animation = { path = "crates/pm-animation" }
pm-style = { path = "crates/pm-style" }
pm-components = { path = "crates/pm-components" }
pm-ui = { path = "crates/pm-ui" }
pm-icon = { path = "crates/pm-icon" }
pm-state = { path = "crates/pm-state" }
pm-input = { path = "crates/pm-input" }
pm-text = { path = "crates/pm-text" }
