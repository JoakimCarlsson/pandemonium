[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.14.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
pm-primitives = { path = "crates/pm-primitives" }
pm-color = { path = "crates/pm-color" }
pm-renderer = { path = "crates/pm-renderer" }
pm-shaders = { path = "crates/pm-shaders" }
pm-layout = { path = "crates/pm-layout" }
pm-typography = { path = "crates/pm-typography" }
pm-decoration = { path = "crates/pm-decoration" }
pm-animation = { path = "crates/pm-animation" }
pm-style = { path = "crates/pm-style" }
pm-components = { path = "crates/pm-components" }
pm-pages = { path = "crates/pm-pages" }
pm-ui = { path = "crates/pm-ui" }
pm-icon = { path = "crates/pm-icon" }
pm-state = { path = "crates/pm-state" }
pm-input = { path = "crates/pm-input" }
pm-text = { path = "crates/pm-text" }
pm-vim = { path = "crates/pm-vim" }
pm-theme = { path = "crates/pm-theme" }
pm-protocol = { path = "crates/pm-protocol" }
pm-git = { path = "crates/pm-git" }
pm-acp = { path = "crates/pm-acp" }
pm-store = { path = "crates/pm-store" }
pm-client = { path = "crates/pm-client" }
pm-ssh = { path = "crates/pm-ssh" }
pm-transport = { path = "crates/pm-transport" }
pm-server = { path = "crates/pm-server" }
pm-markdown = { path = "crates/pm-markdown" }
pm-terminal = { path = "crates/pm-terminal" }
pm-buffer = { path = "crates/pm-buffer" }
pm-treesitter = { path = "crates/pm-treesitter" }
pm-lsp = { path = "crates/pm-lsp" }
pm-tools = { path = "crates/pm-tools" }
pm-dap = { path = "crates/pm-dap" }
pm-task = { path = "crates/pm-task" }
pm-editor = { path = "crates/pm-editor" }
pm-config = { path = "crates/pm-config" }
pm-policy = { path = "crates/pm-policy" }
pm-plugin-api = { path = "crates/pm-plugin-api" }
pm-wasm = { path = "crates/pm-wasm" }
pm-plugin = { path = "crates/pm-plugin" }
pm-agent-library = { path = "crates/pm-agent-library" }
pm-mcp = { path = "crates/pm-mcp" }
pm-update = { path = "crates/pm-update" }

[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
